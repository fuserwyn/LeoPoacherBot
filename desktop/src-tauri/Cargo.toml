[package]
name = "fatleopard-desktop"
version = "0.1.0"
description = "MyVibeLab для macOS и Windows"
authors = ["MyVibeLab"]
edition = "2021"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с именем бинарника.
name = "fatleopard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо системного TLS: предсказуемо ведёт себя в подписанном бандле.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.8"
base64 = "0.22"
