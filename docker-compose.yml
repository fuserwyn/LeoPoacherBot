version: '3.8'

services:
  bot:
    build:
      context: ./ms_leo
      dockerfile: Dockerfile
    environment:
      - FAT_LEOPARD_API_TOKEN=${FAT_LEOPARD_API_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - MONETIZED_CHAT_INVITE_URL=${MONETIZED_CHAT_INVITE_URL}
      - OWNER_ID=${OWNER_ID}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/leo_bot_db?sslmode=disable}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOG_LEVEL=info
      - PAYWALL_ENABLED=${PAYWALL_ENABLED:-false}
      - MONETIZED_CHAT_ID=${MONETIZED_CHAT_ID:-}
      - PAYMENT_PROVIDER_TOKEN=${PAYMENT_PROVIDER_TOKEN:-}
      - PAYMENT_CURRENCY=${PAYMENT_CURRENCY:-RUB}
      - PAYMENT_AMOUNT_RUB=${PAYMENT_AMOUNT_RUB:-}
      - PAYMENT_STARS_ENABLED=${PAYMENT_STARS_ENABLED:-false}
      - PAYMENT_STARS_AMOUNT=${PAYMENT_STARS_AMOUNT:-}
      - PAYMENT_AMOUNT_MINOR_UNITS=${PAYMENT_AMOUNT_MINOR_UNITS:-9900}
      - PAYMENT_INVOICE_TITLE=${PAYMENT_INVOICE_TITLE:-Доступ в группу}
      - PAYMENT_INVOICE_DESCRIPTION=${PAYMENT_INVOICE_DESCRIPTION:-Разовый доступ после оплаты заявка будет одобрена автоматически.}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-}
      - YOOKASSA_NOTIFICATION_URL=${YOOKASSA_NOTIFICATION_URL:-}
      # Фото тренировок в Cloudflare R2 (если пусто — локальный диск)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Вебхук ЮKassa.
  # DATABASE_URL — ОБЯЗАТЕЛЬНО та же строка подключения, что у сервиса bot: здесь же таблица
  # paywall_access_requests; бот (ms_leo) читает оттуда доступ. Другая БД = бот не увидит оплату.
  # PAYMENT_DATABASE_URL — опционально вторая БД только для леджера yookassa_payment_events (аудит).
  payment-webhook:
    build:
      context: ./ms_payments
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/leo_bot_db?sslmode=disable}
      - PAYMENT_DATABASE_URL=${PAYMENT_DATABASE_URL:-postgresql://postgres:password@postgres:5432/leo_payments?sslmode=disable}
      - FAT_LEOPARD_API_TOKEN=${FAT_LEOPARD_API_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - MONETIZED_CHAT_ID=${MONETIZED_CHAT_ID}
      - MONETIZED_INVITE_CREATES_JOIN_REQUEST=${MONETIZED_INVITE_CREATES_JOIN_REQUEST:-true}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_WEBHOOK_VERIFY_BASIC_AUTH=${YOOKASSA_WEBHOOK_VERIFY_BASIC_AUTH:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:8000"

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=leo_bot_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leo_bot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@postgres:5432/leo_bot_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    build:
      context: ./docker/grafana
      dockerfile: Dockerfile
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
