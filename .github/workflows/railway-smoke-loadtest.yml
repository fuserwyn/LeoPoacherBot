name: Railway Smoke Load Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.RAILWAY_MS_LEO_URL }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MONETIZED_CHAT_ID: ${{ secrets.MONETIZED_CHAT_ID }}
      USERS_TOTAL: 5000
      TEST_DURATION: 15m
      RATE_PER_SEC: 1
      PRE_ALLOCATED_VUS: 120
      MAX_VUS: 800
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Validate required secrets
        run: |
          test -n "$BASE_URL" || (echo "Missing secret: RAILWAY_MS_LEO_URL" && exit 1)
          test -n "$BOT_TOKEN" || (echo "Missing secret: TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$MONETIZED_CHAT_ID" || (echo "Missing secret: MONETIZED_CHAT_ID" && exit 1)

      - name: Wait for rollout to settle
        run: sleep 120

      - name: Run 15-minute smoke test
        working-directory: ms_leo
        run: k6 run loadtest/k6-24h-5000-users.js

      - name: Upload k6 summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: ms_leo/loadtest-summary.json
          if-no-files-found: ignore
